app:
  name: LogCollectorGL
  code: LCGL
  notify: appz@cloudbourne.co

build:
  version: 6.3
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: graylog-6.3
  image_name: alpha/log-collector-gl

deploy:
  context: alpha/DEV
  replicas: 1
  port:
  - 9000
  - 12201

volumes:
- claim: graylog-data
  mount: /usr/share/graylog/data/journal
  name: graylog-data

monitor:
  notify: appzops@cloudbourne.co      

properties:
  revision : 25
  GRAYLOG_MONGODB_URI : mongodb://appz-logcollectordb-8-0:27017/graylog
  GRAYLOG_ELASTICSEARCH_HOSTS : http://appz-logcollectores-2-15:9200/
  GRAYLOG_ELASTICSEARCH_DISCOVERY_ENABLED : false
  GRAYLOG_ROOT_PASSWORD_SHA2 : {{lcsecret_sha}}
  GRAYLOG_PASSWORD_SECRET : "{{graylog_password_secret}}"
  OPENSEARCH_INITIAL_ADMIN_PASSWORD : "{{opensearch_initial_admin_password}}"
  
